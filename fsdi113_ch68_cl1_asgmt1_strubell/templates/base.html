<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/sgng_styles.css' %}">

    <title>SGnG Assignment 1</title>
</head>
<body>

<nav class="sgng-navbar">
    <div class="sgng-nav-left">
        <span class="sgng-brand">SGnG</span>
    </div>

    <div class="sgng-nav-right">
        {% if user.is_authenticated %}
            <a href="{% url 'logout' %}" class="sgng-nav-link">Logout</a>
        {% else %}
            <a href="{% url 'login' %}" class="sgng-nav-link">Login</a>
        {% endif %}
    </div>
</nav>

<main class="sgng-main">
    {% block content %}
    {% endblock %}
</main>

</body>
</html>
