{% extends "base.html" %}

{% block content %}
<div class="sgng-container">
    <h1 class="sgng-title">Account Security</h1>

    <div class="sgng-security-panel">

        <a href="{% url 'password_change' %}" class="sgng-button sgng-danger">Change Password</a>
    </div>
</div>
{% endblock %}
